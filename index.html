<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030309" />
    <!--
      CSP via meta tag: best-effort hardening within GitHub Pages limits
      (no server headers available). 'unsafe-inline' styles are required by
      React/GSAP inline style attributes; blob: workers are permitted for
      potential three.js loaders. frame-ancestors cannot be set via meta.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' mailto:"
    />
    <meta
      name="description"
      content="HorizonX connects marketing, websites, business applications, automation, and AI through one digitalization intelligence network for growing businesses. From 0% to 100% digitalization."
    />
    <link rel="canonical" href="https://horizonx.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HorizonX" />
    <meta property="og:url" content="https://horizonx.site/" />
    <meta property="og:title" content="HorizonX — The Digitalization Intelligence Network" />
    <meta
      property="og:description"
      content="One intelligence layer. Five connected products. From 0% to 100% digitalization."
    />
    <!-- og-image.png is a temporary implementation of the brand identity;
         replace with final branded artwork before the definitive campaign -->
    <meta property="og:image" content="https://horizonx.site/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HorizonX — The Digitalization Intelligence Network" />
    <meta
      name="twitter:description"
      content="One intelligence layer. Five connected products. From 0% to 100% digitalization."
    />
    <meta name="twitter:image" content="https://horizonx.site/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>HorizonX — The Digitalization Intelligence Network</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
